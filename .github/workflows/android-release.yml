name: Android APK release

# Builds the android/ app on GitHub's own runners (unlike this dev session, they have a real
# Android SDK and unrestricted network access, so this is the reliable place to build).
#
# Run it manually from the Actions tab ("Run workflow"), or push a tag like `android-v0.1.0`
# to also publish a GitHub Release with the APK attached.
on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write google-services.json
        # Required secret — see android/README.md's "GitHub Actions" section for how to add it.
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookhook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
